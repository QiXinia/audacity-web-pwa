[package]
name = "audio_processor"
version = "0.1.0"
edition = "2021"
description = "Audio processing WASM module for Audacity Web - DSP, FFT, effects"
license = "GPL-3.0-only"
repository = "https://github.com/QiXinia/audacity-web-pwa"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"

[profile.release]
opt-level = "s"
lto = true
